<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>合法多次手动看广告 - 游戏复活</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#111;
            color:#fff;
            font-family:"Microsoft Yahei",sans-serif;
            padding:40px 15px;
            text-align:center;
        }
        .wrap{
            max-width:420px;
            margin:0 auto;
            background:#252525;
            padding:35px 25px;
            border-radius:18px;
        }
        h2{
            color:#ffd700;
            margin-bottom:20px;
            font-size:22px;
        }
        .desc{
            color:#ccc;
            line-height:1.8;
            margin-bottom:30px;
        }
        .btn-ad{
            background:#ffd700;
            color:#000;
            border:none;
            font-size:17px;
            font-weight:bold;
            padding:13px 30px;
            border-radius:10px;
            cursor:pointer;
            margin:8px 0;
        }
        .btn-ad:disabled{
            background:#444;
            color:#888;
            cursor:not-allowed;
        }
        .ad-box{
            min-height:250px;
            margin:25px auto;
            border:1px solid #555;
            border-radius:8px;
            overflow:hidden;
            background:#1a1a1a;
            padding:10px;
        }
        .success-txt{
            color:#4cd964;
            font-size:16px;
            margin-top:20px;
            display:none;
        }
        .tip-note{
            color:#777;
            font-size:13px;
            margin-top:25px;
        }
    </style>
</head>
<body>

<div class="wrap">
    <h2>🎮 游戏闯关复活</h2>
    <div class="desc">
        闯关失败，手动观看广告即可复活<br>
        支持多次手动观看，合规安全不封号
    </div>

    <button class="btn-ad" id="watchBtn">手动观看广告 立即复活</button>

    <!-- 广告单独容器，点击按钮才加载 -->
    <div class="ad-box" id="adContainer"></div>

    <div class="success-txt" id="successMsg">✅ 广告观看完成，复活成功！可再次手动观看</div>

    <button class="btn-ad" id="resetBtn" style="display:none;background:#2196F3;color:#fff;">
        重置状态 再次看广告
    </button>

    <div class="tip-note">合法手动点击观看，无自动刷量，安全合规</div>
</div>

<script>
const watchBtn = document.getElementById('watchBtn');
const resetBtn = document.getElementById('resetBtn');
const adContainer = document.getElementById('adContainer');
const successMsg = document.getElementById('successMsg');

watchBtn.addEventListener('click', function(){
    watchBtn.disabled = true;
    watchBtn.innerText = '广告加载中，请稍候...';

    // 清空旧广告，全新动态加载Adsterra代码
    adContainer.innerHTML = '';

    // 加载你的专属广告代码
    let adScript = document.createElement('script');
    adScript.async = true;
    adScript.dataset.cfasync = false;
    adScript.src = "https://pl29513832.effectivecpmnetwork.com/bef336e58a646a77f708dd9d2cd44ccd/invoke.js";
    adContainer.appendChild(adScript);

    let adDiv = document.createElement('div');
    adDiv.id = "container-bef336e58a646a77f708dd9d2cd44ccd";
    adContainer.appendChild(adDiv);

    // 计时模拟观看完成
    setTimeout(() => {
        successMsg.style.display = 'block';
        resetBtn.style.display = 'inline-block';
        watchBtn.innerText = '新的已观看完成';
    }, 12000);
});

// 重置刷新
resetBtn.addEventListener('click', function(){
    adContainer.innerHTML = '';
    successMsg.style.display = 'none';
    resetBtn.style.display = 'none';
    watchBtn.disabled = false;
    watchBtn.innerText = '手动观看广告 立即复活';
});
</script>

</body>
</html>
